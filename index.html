<!DOCTYPE html>

<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="QR code component for Frontend Mentor challenge">
    <link rel="icon" href="./images/favicon-32x32.png" type="image/png" sizes="32x32">
    <link rel="stylesheet" href="./style.css">
    <title>Frontend Mentor | QR code component</title>
  </head>

  <body>
     <!-- Main component: the white card containing the QR code -->
    <main class="qr-card-component">

        <!-- QR image at the top of the card -->
      <img 
        src="./images/image-qr-code.png" 
        alt="QR code" 
        class="qr-code"
        >
      
      <!-- Text content below the QR code -->
      <h1>Improve your front-end skills by building projects</h1>

      <p>Scan the QR code to visit Frontend Mentor and take your coding skills to the next level</p>
    </main>
    
    <!-- Footer with attribution -->
    <footer class="attribution">

      Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 

      Coded by <a href="#">Quentin Cyrus</a>
    </footer>
  </body>
</html>
